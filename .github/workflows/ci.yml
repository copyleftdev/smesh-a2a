name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Documentation
        run: cargo doc --no-deps
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Install demo tooling
        run: npm ci --prefix demo
      - name: Audit demo tooling
        run: npm audit --audit-level=high --prefix demo
      - name: Test demo tooling
        run: |
          node --check demo/export-film.mjs
          node --check demo/record-film.mjs
          node --check demo/serve-demo.mjs
          npm test --prefix demo
      - name: Verify deterministic cinematic trace
        run: |
          cargo run --quiet --bin lifeline-trace -- /tmp/lifeline.trace.jsonl
          cmp /tmp/lifeline.trace.jsonl demo/lifeline.trace.jsonl
