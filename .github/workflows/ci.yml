name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check minimum supported Rust version
        run: cargo check --all-targets --all-features

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit Rust dependencies
        run: cargo audit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Release all-target/all-feature suite
        run: cargo test --release --locked --all-targets --all-features -- --test-threads=1
      - name: Documentation
        run: RUSTDOCFLAGS='-D warnings' cargo doc --all-features --no-deps
      - name: Diff hygiene
        run: git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Install demo tooling
        run: npm ci --prefix demo
      - name: Audit demo tooling
        run: npm audit --audit-level=high --prefix demo
      - name: Test demo tooling
        run: |
          node --check demo/export-film.mjs
          node --check demo/record-film.mjs
          node --check demo/serve-demo.mjs
          npm test --prefix demo
      - name: Verify deterministic cinematic trace
        run: |
          cargo run --quiet --bin lifeline-trace -- /tmp/lifeline.trace.jsonl
          cmp /tmp/lifeline.trace.jsonl demo/lifeline.trace.jsonl

  push-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Disabled-card and callback security corpus
        run: |
          timeout --signal=TERM --kill-after=10s 5m cargo test --locked --test agent_card --test push_security

  push-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: smesh-ci-postgres
          POSTGRES_DB: smesh_test
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      SMESH_TEST_POSTGRES_SUPERUSER_URL: postgresql://postgres:smesh-ci-postgres@127.0.0.1:55432/smesh_test
      SMESH_TEST_POSTGRES_ADMIN_URL: postgresql://smesh_migrator:smesh-ci-migrator@127.0.0.1:55432/smesh_test
      SMESH_TEST_POSTGRES_RUNTIME_URL: postgresql://smesh_test_runtime:smesh-ci-runtime@127.0.0.1:55432/smesh_test
      SMESH_POSTGRES_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Assert raw push PostgreSQL fixture credentials
        run: |
          python3 - <<'PY'
          from pathlib import Path
          raw = Path('.github/workflows/ci.yml').read_text()
          block = raw.split('  push-postgres:', 1)[1].split('\n  observability:', 1)[0]
          fixtures = (
              ('postgres', 'smesh-ci-postgres'),
              ('smesh_migrator', 'smesh-ci-migrator'),
              ('smesh_test_runtime', 'smesh-ci-runtime'),
          )
          for role, password in fixtures:
              expected = f'postgresql://{role}:{password}@127.0.0.1:55432/smesh_test'
              assert expected in block, f'missing exact raw push fixture URL for {role}'
          assert ':' + '***@' not in raw, 'redacted display placeholder was committed to raw YAML'
          PY
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Provision explicit PostgreSQL push roles
        env:
          PGPASSWORD: smesh-ci-postgres
        run: |
          pg_isready -h 127.0.0.1 -p 55432 -U postgres -d smesh_test
          psql -h 127.0.0.1 -p 55432 -U postgres -d smesh_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE smesh_migrator LOGIN PASSWORD 'smesh-ci-migrator' NOSUPERUSER NOBYPASSRLS NOCREATEDB CREATEROLE NOREPLICATION NOINHERIT;
          CREATE ROLE smesh_test_runtime LOGIN PASSWORD 'smesh-ci-runtime' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION NOINHERIT;
          GRANT CREATE ON DATABASE smesh_test TO smesh_migrator;
          SQL
      - name: Callback authority, plans, reconciliation, and process recovery
        run: |
          timeout --signal=TERM --kill-after=15s 5m cargo test --locked --test callback_authority -- --test-threads=1
          timeout --signal=TERM --kill-after=15s 10m cargo test --locked --test postgres_push_process -- --test-threads=1

  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: smesh-ci-postgres
          POSTGRES_DB: smesh_test
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      SMESH_TEST_POSTGRES_SUPERUSER_URL: postgresql://postgres:smesh-ci-postgres@127.0.0.1:55432/smesh_test
      SMESH_TEST_POSTGRES_ADMIN_URL: postgresql://smesh_migrator:smesh-ci-migrator@127.0.0.1:55432/smesh_test
      SMESH_TEST_POSTGRES_RUNTIME_URL: postgresql://smesh_test_runtime:smesh-ci-runtime@127.0.0.1:55432/smesh_test
      SMESH_POSTGRES_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Provision explicit PostgreSQL observability roles
        env:
          PGPASSWORD: smesh-ci-postgres
        run: |
          pg_isready -h 127.0.0.1 -p 55432 -U postgres -d smesh_test
          psql -h 127.0.0.1 -p 55432 -U postgres -d smesh_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE smesh_migrator LOGIN PASSWORD 'smesh-ci-migrator' NOSUPERUSER NOBYPASSRLS NOCREATEDB CREATEROLE NOREPLICATION NOINHERIT;
          CREATE ROLE smesh_test_runtime LOGIN PASSWORD 'smesh-ci-runtime' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION NOINHERIT;
          GRANT CREATE ON DATABASE smesh_test TO smesh_migrator;
          SQL
      - name: Closed schema, outage, audit projection, process recovery, real OTLP, and assets
        run: |
          timeout --signal=TERM --kill-after=10s 5m cargo test --locked --test telemetry_schema --test telemetry_outage --test telemetry_ingress --test telemetry_audit_projection --test telemetry_otlp --test telemetry_multisignal --test telemetry_golden --test observability_assets
          timeout --signal=TERM --kill-after=15s 8m cargo test --locked --test postgres_observability_process -- --test-threads=1
      - name: Validate Prometheus recording and alert rules
        run: docker run --rm --entrypoint=/bin/promtool -v "$PWD:/workspace:ro" prom/prometheus:v3.5.0 check rules /workspace/observability/prometheus-rules.yml

  postgres:
    runs-on: ubuntu-latest
    # Command watchdogs total 75 minutes; keep a bounded margin for builds and
    # service setup without re-running postgres_store selections.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: smesh-ci-postgres
          POSTGRES_DB: smesh_test
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      SMESH_TEST_POSTGRES_SUPERUSER_URL: postgresql://postgres:smesh-ci-postgres@127.0.0.1:55432/smesh_test
      SMESH_TEST_POSTGRES_ADMIN_URL: postgresql://smesh_migrator:smesh-ci-migrator@127.0.0.1:55432/smesh_test
      SMESH_TEST_POSTGRES_RUNTIME_URL: postgresql://smesh_test_runtime:smesh-ci-runtime@127.0.0.1:55432/smesh_test
      SMESH_POSTGRES_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify PostgreSQL readiness
        env:
          PGPASSWORD: smesh-ci-postgres
        run: |
          pg_isready -h 127.0.0.1 -p 55432 -U postgres -d smesh_test
          psql -h 127.0.0.1 -p 55432 -U postgres -d smesh_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE smesh_migrator LOGIN PASSWORD 'smesh-ci-migrator' NOSUPERUSER NOBYPASSRLS NOCREATEDB CREATEROLE NOREPLICATION NOINHERIT;
          CREATE ROLE smesh_test_runtime LOGIN PASSWORD 'smesh-ci-runtime' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION NOINHERIT;
          GRANT CREATE ON DATABASE smesh_test TO smesh_migrator;
          SQL
          PGPASSWORD=smesh-ci-migrator psql -h 127.0.0.1 -p 55432 -U smesh_migrator -d smesh_test -c 'SELECT current_user'
          PGPASSWORD=smesh-ci-runtime psql -h 127.0.0.1 -p 55432 -U smesh_test_runtime -d smesh_test -c 'SELECT current_user'
      - name: Artifact Phase-A evidence and migration
        run: |
          timeout --signal=TERM --kill-after=15s 5m cargo test --locked --test artifact_migration -- --test-threads=1
          timeout --signal=TERM --kill-after=15s 5m cargo test --locked --test artifact_operators -- --test-threads=1
          timeout --signal=TERM --kill-after=15s 5m cargo test --locked --test artifact_storage -- --test-threads=1
      - name: PostgreSQL schema-v6 conformance, quota abuse matrix, and failover
        run: |
          for run in 1 2 3; do
            echo "artifact process crash matrix run ${run}/3"
            timeout --signal=TERM --kill-after=15s 10m cargo test --locked --test postgres_artifact_process -- --test-threads=1
          done
          timeout --signal=TERM --kill-after=15s 15m cargo test --locked --test postgres_store -- --test-threads=1
          timeout --signal=TERM --kill-after=15s 5m cargo test --locked --test postgres_multi_replica -- --test-threads=1
          timeout --signal=TERM --kill-after=15s 5m cargo test --locked --test authorized_gateway_process production_binary_selects_postgres_and_replays_after_graceful_restart -- --exact --test-threads=1
          timeout --signal=TERM --kill-after=15s 5m cargo test --locked --test postgres_quota_process -- --test-threads=1
