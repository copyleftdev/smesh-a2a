groups:
  - name: smesh-a2a-alerts
    interval: 30s
    rules:
      - alert: SmeshA2AEdgeAvailability
        expr: sum(rate(smesh_a2a_sli_event_total{smesh_slo="edge_availability",smesh_result="eligible_bad"}[5m])) / clamp_min(sum(rate(smesh_a2a_sli_event_total{smesh_slo="edge_availability",smesh_result=~"eligible_good|eligible_bad"}[5m])), 1e-12) > 0.001
        for: 5m
        labels: {severity: page}
      - alert: SmeshA2AAuditProjectionFailures
        expr: increase(smesh_a2a_audit_projection_failure_total[5m]) > 0
        labels: {severity: warning}
      - alert: SmeshA2AAuditProjectionLag
        expr: smesh_a2a_audit_projection_lag_seconds > 300
        for: 5m
        labels: {severity: warning}
