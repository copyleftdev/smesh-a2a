[package]
name = "smesh-a2a"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "A2A v1 interoperability gateway for SMESH swarms"
repository = "https://github.com/copyleftdev/smesh-a2a"

[lib]
name = "smesh_a2a"
path = "src/lib.rs"

[[bin]]
name = "smesh-a2a-gateway"
path = "src/main.rs"

[dependencies]
a2a = { package = "a2a-lf", version = "0.3.0" }
a2a-client = { package = "a2a-client-lf", version = "0.2.2" }
aes-gcm = "0.10"
a2a-server = { package = "a2a-server-lf", version = "0.4.1" }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
fs2 = "0.4"
hmac = "0.12"
httpdate = "1"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
rustix = { version = "1", features = ["fs", "process"] }
arc-swap = "1"
tokio-rustls = "0.26"
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
tokio-postgres-rustls = "0.13"
rustls-native-certs = "0.8"
rustls = "0.23"
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
smesh-core = { git = "https://github.com/copyleftdev/smesh-rust", rev = "ff0a88ba75590957e2e108f99e90135cd4b6de80" }
smesh-runtime = { git = "https://github.com/copyleftdev/smesh-rust", rev = "ff0a88ba75590957e2e108f99e90135cd4b6de80" }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.9"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
mime = "0.3"
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs", "grpc-tonic", "http-proto", "reqwest-rustls", "tls-aws-lc", "tls-roots"] }
opentelemetry-appender-tracing = { version = "0.32", default-features = false }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic", "logs", "trace", "metrics"] }
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
tonic = "0.14"
url = "2"
# Direct dependency: reloads must inspect leaf DNS/IP SANs before atomic publish;
# rustls/webpki verify names internally but do not expose parsed SANs for this invariant.
x509-parser = "0.18"
zeroize = { version = "1", features = ["zeroize_derive"] }

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
proptest = "1"
rcgen = "0.13"
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
wait-timeout = "0.2"

[patch.crates-io]
a2a-lf = { path = "vendor/a2a-lf" }
a2a-server-lf = { path = "vendor/a2a-server-lf" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
